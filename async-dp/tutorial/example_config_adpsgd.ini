[DATASET]
dataset_package = asyncNodes.datasets.CIFAR10
dataset_class = CIFAR10
model_class = LeNet
train_dir = /CIFAR
test_dir = /CIFAR
sizes = 
#random_seed = 97
partition_niid = kshard
shards = 5

[OPTIMIZER_PARAMS]
optimizer_package = torch.optim
optimizer_class = SGD
lr = 0.05

[TRAIN_PARAMS]
training_package = asyncNodes.training.Training
training_class = Training
rounds = 128
full_epochs = False
batch_size = 8
shuffle = True
loss_package = torch.nn
loss_class = CrossEntropyLoss
device = cpu

[COMMUNICATION]
comm_package = asyncNodes.communication.TCP
comm_class = TCP
addresses_filepath = /all_ips.json

[SHARING]
sharing_package = asyncNodes.sharing.DivShareSharing
sharing_class = ChunkSharingRandom

[NODE]
graph_degree = 6
threads_per_proc = 2
timeout = 800

[ASYNC_PARAMS]
eval_on_train_set = False
eval_on_test_set = False
store_model = False